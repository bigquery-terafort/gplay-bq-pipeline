name: zz-migrate-secrets
on:
  workflow_dispatch:
    inputs:
      gitlab_url: { required: true, type: string }
      project_id: { required: true, type: string }
permissions: {}
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy secrets to GitLab CI/CD variables
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          GITLAB_URL: ${{ inputs.gitlab_url }}
          GITLAB_PROJECT_ID: ${{ inputs.project_id }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIGRATION_TOKEN }}
        run: |
          set -uo pipefail
          base="$GITLAB_URL/api/v4/projects/$GITLAB_PROJECT_ID"
          fail=0; code=000
          : > resp.tmp; : > err.tmp
          detail() { echo "HTTP $code | $(head -c 200 resp.tmp | tr '\n' ' ') | $(head -c 300 err.tmp | tr '\n' ' ')"; }
          req() {  # prints the HTTP code; body -> resp.tmp, curl error text -> err.tmp
            curl -sS -o resp.tmp -w '%{http_code}' --connect-timeout 15 --max-time 60 \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "$@" 2>err.tmp || true
          }
          if [ -z "$GITLAB_TOKEN" ]; then echo "::error::PREFLIGHT: temporary secret GITLAB_MIGRATION_TOKEN is empty"; exit 1; fi
          code=$(req "$base")
          if [ "$code" != "200" ]; then echo "::error::PREFLIGHT: cannot reach or authenticate to GitLab: $(detail)"; exit 1; fi
          push() {  # $1 = masked true/false; create, else update
            code=$(req -X POST "$base/variables" --form-string "key=$key" -F "value=<val.tmp" -F "masked=$1")
            if [ "$code" = "400" ]; then
              code=$(req -X PUT "$base/variables/$key" -F "value=<val.tmp" -F "masked=$1")
            fi
            [ "$code" = "200" ] || [ "$code" = "201" ]
          }
          for key in $(jq -r 'keys[]' <<<"$ALL_SECRETS"); do
            case "$key" in github_token|GITLAB_MIGRATION_TOKEN) continue ;; esac
            jq -j --arg k "$key" '.[$k]' <<<"$ALL_SECRETS" > val.tmp
            if push true; then echo "OK (masked): $key"
            elif push false; then echo "::warning::$key stored UNMASKED (value not maskable)"
            else echo "::error::FAILED: $key: $(detail)"; fail=1; fi
          done
          rm -f val.tmp resp.tmp err.tmp
          exit $fail
